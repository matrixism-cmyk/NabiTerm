[package]
name = "nabi-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nabi-types = { workspace = true }
nabi-proto = { workspace = true }
nabi-orchestrator = { workspace = true } # SharedPanes 읽기(질의 응답 출처)
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"                # wait --regex(B2) 출력 패턴 대기
nabi-agentdetect = { workspace = true }  # agent explain(A4) 화면 규칙 평가
nabi-config = { workspace = true }       # security audit(C6) 설정 점검
nabi-vt = { workspace = true } # TermModel 직접 질의(tail 델타·bracketed paste)
crossbeam-channel = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

# 살아 있는 인스턴스 판정(discovery) — 프로세스 종료 코드만 묻는다.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading"] }
