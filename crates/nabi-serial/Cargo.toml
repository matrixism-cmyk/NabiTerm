[package]
name = "nabi-serial"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
nabi-types = { workspace = true }
nabi-error = { workspace = true }  # 오류를 말이 아니라 코드로 나른다(T8-1).
nabi-pty = { workspace = true }    # ByteChannel — pane 의 입력 싱크는 한 규격뿐이다.
crossbeam-channel = { workspace = true }
bytes = { workspace = true }
# 직렬 포트 열거·열기. MPL-2.0 은 deny.toml 허용 목록에 있다(파일 단위 카피레프트라
# 우리 소스에는 영향이 없다). 윈도우의 포트 열거는 레지스트리·SetupAPI 를 타야 해서
# 직접 쓰면 그것만으로 한 모듈이 된다.
serialport = { workspace = true }
