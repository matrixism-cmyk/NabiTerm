name: ci

# 품질 게이트를 사람이 기억해서 돌리는 대신 기계가 강제한다.
# (라인 한도 → 포맷 → clippy 0경고 → 테스트 순서 = 개발 중 게이트와 동일)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # 디버그 정보는 target을 크게 부풀린다. CI 캐시 한도(리포지토리당 10GB) 안에 들어가게 끈다.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  windows-msvc:
    # windows-latest는 예고 없이 이미지가 바뀐다 → 고정.
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 우리가 **실제로 배포하는 타깃**을 CI가 재고 있는지 확인한다.
      #
      # 2026-09-10까지 이 잡은 이름이 `windows-gnu`였고 `targets: x86_64-pc-windows-gnu`를
      # 설치했지만, 정작 어느 단계에도 `--target`이 없어 **호스트(=msvc)를 빌드하고 있었다.**
      # 이름과 실제가 다르면 다음 사람이 "gnu는 검증됐다"고 믿는다. 그래서 이름을 맞추고,
      # 여기서 한 번 세어 둔다 — 호스트가 바뀌면 3초 만에 명확히 실패한다.
      #
      # 같은 날 "VCRUNTIME140_1.dll이 없다"로 프로그램이 아예 안 뜨던 결함의 뿌리가 이것이다:
      # 검사가 재는 대상과 우리가 보내는 물건이 달랐다.
      - name: 타깃 확인 (배포 대상과 같은가)
        shell: pwsh
        run: |
          $host_triple = (rustc -vV | Select-String '^host: ').ToString().Split(' ')[1]
          Write-Host "host = $host_triple"
          if ($host_triple -ne 'x86_64-pc-windows-msvc') {
            throw "CI가 $host_triple 을 빌드한다 — 배포 대상(x86_64-pc-windows-msvc)과 다르다"
          }

      # 캐시 키에 rustc 버전이 들어가므로 반드시 툴체인 설치 뒤에 온다.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win-msvc
          cache-on-failure: true
          # 캐시 저장은 main에서만 — PR마다 저장하면 10GB 한도를 금방 넘겨 서로 밀어낸다.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # 소스 파일 크기 규율(소프트 250 / 하드 400 코드줄).
      - name: 라인 한도
        run: cargo run -p xtask --locked -- lines

      # 사전배포(alpha/beta/rc) 의존성 게이트 — 허용 목록에 없는 게 새로 생기면 실패.
      # cargo-deny로는 잡히지 않는다(잠긴 버전이 사전배포인지는 검사 항목이 아니다).
      - name: 사전배포 의존성
        run: cargo run -p xtask --locked -- prerelease

      # 포맷 검사(cargo fmt --check)는 일부러 넣지 않는다.
      # 이 코드베이스는 파일 크기 규율(250줄) 때문에 짧은 문장을 한 줄에 묶는 관용구를 쓰는데,
      # rustfmt는 그걸 모두 펼쳐 라인 한도를 깨뜨린다(현재 1,300곳 이상 상이).
      # 포맷을 강제하려면 라인 한도와의 상충을 먼저 해결해야 한다 — 그 전에는 규율의 실체인
      # 라인 한도와 clippy만 기계로 강제한다.

      # 경고 0이 릴리스 기준이므로 CI에서도 경고를 오류로 취급한다.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 테스트
        run: cargo test --workspace --locked

      # 실서버가 필요한 #[ignore] 테스트는 환경변수가 없으면 스스로 건너뛴다.
      # 여기서는 "적어도 컴파일되고 수집된다"까지만 확인한다.
      - name: 실서버 테스트 수집 확인
        run: cargo test -p nabi-sftp --locked -- --ignored --list

  # 라이선스·보안 권고·출처 점검. 코드와 무관하게 의존성만 보므로 별도 잡으로 병렬 실행한다.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # deny.toml이 대상 트리플을 windows-msvc(=배포 대상)로 고정하므로 러너 OS와 무관하게 같은 그래프를 본다.
          arguments: --all-features
