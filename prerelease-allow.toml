# 사전배포(alpha/beta/rc) 의존성 허용 목록 — `cargo run -p xtask -- prerelease`가 읽는다.
#
# 여기 적힌 이름은 게이트를 통과한다. **새로 생기는 사전배포는 실패**하므로, 늘어날 때마다
# 사람이 한 번 보고 판단하게 된다(그게 이 게이트의 목적이다).
#
# russh 0.62.6 상향(2026-08-16, v0.1.423 준비)으로 RustCrypto 대부분이 정식판이 되어
# 18건→5건으로 줄였다. 남은 5건은 전부 ssh-key 0.7.0-rc가 끌어오는 사슬이다(러시 쪽에서
# ssh-key 정식판을 받으면 같이 지운다). argon2 rc는 볼트용 0.5와 별개의 두 번째 사본이다.
argon2  # 0.6.0-rc.8 (ssh-key 경유; 볼트는 정식 0.5를 따로 쓴다)
blake2  # 0.11.0-rc.6
pkcs1  # 0.8.0-rc.4
rsa  # 0.10.0-rc.18
ssh-key  # 0.7.0-rc.11
