# 사전배포(alpha/beta/rc) 의존성 허용 목록 — `cargo run -p xtask -- prerelease`가 읽는다.
#
# 여기 적힌 이름은 게이트를 통과한다. **새로 생기는 사전배포는 실패**하므로, 늘어날 때마다
# 사람이 한 번 보고 판단하게 된다(그게 이 게이트의 목적이다).
#
# 아래 18건은 전부 russh 0.61.2가 끌어오는 RustCrypto 계열이다. 우리가 고를 수 있는 게
# 아니고(russh가 그 버전을 요구한다), SSH 키 처리와 암호화를 실제로 담당한다.
# russh가 정식 릴리스로 올라가면 이 목록도 같이 줄여야 한다 — 방치하면 게이트가 무의미해진다.
#
# 확인: 2026-08-06 (v0.1.410 준비 중). 뒤의 주석은 그때 잠겨 있던 버전.
