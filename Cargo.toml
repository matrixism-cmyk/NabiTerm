# nabi — Cargo workspace root.
# 모든 외부 의존성은 여기서 정확히 핀 고정한다(단일 진실원).
# 버전은 2026-06 기준 계획값. UI/term/ssh 등 변동 큰 크레이트는 빌드 시 `cargo update`로 확인.
[workspace]
resolver = "2"
members = [
    "crates/nabi-types",
    "crates/nabi-error",
    "crates/nabi-proto",
    "crates/nabi-log",
    "crates/nabi-config",
    "crates/nabi-i18n",
    "crates/nabi-vt",
    "crates/nabi-agentdetect",
    "crates/nabi-image",
    "crates/nabi-pty",
    "crates/nabi-osc",
    "crates/nabi-orchestrator",
    "crates/nabi-control",
    "crates/nabi-release",
    "crates/nabi-telegram",
    "crates/nabi-ssh",
    "crates/nabi-ssh-ext",
    "crates/nabi-session",
    "crates/nabi-secret",
    "crates/nabi-fs",
    "crates/nabi-sftp",
    "crates/nabi-editor",
    "crates/nabi-ftp",
    "crates/nabi-render",
    "crates/nabi-app",
    "xtask",
]

[workspace.package]
version = "0.1.431"
edition = "2021"
license = "Apache-2.0"
authors = ["aeo <the@aeokorea.com>"]
publish = false
rust-version = "1.87"

[workspace.dependencies]
# --- internal crates ---
nabi-types = { path = "crates/nabi-types" }
nabi-error = { path = "crates/nabi-error" }
nabi-proto = { path = "crates/nabi-proto" }
nabi-log = { path = "crates/nabi-log" }
nabi-config = { path = "crates/nabi-config" }
nabi-i18n = { path = "crates/nabi-i18n" }
nabi-vt = { path = "crates/nabi-vt" }
nabi-agentdetect = { path = "crates/nabi-agentdetect" }
nabi-image = { path = "crates/nabi-image" }
nabi-osc = { path = "crates/nabi-osc" }
nabi-pty = { path = "crates/nabi-pty" }
nabi-orchestrator = { path = "crates/nabi-orchestrator" }
nabi-control = { path = "crates/nabi-control" }
nabi-release = { path = "crates/nabi-release" }
nabi-telegram = { path = "crates/nabi-telegram" }
nabi-render = { path = "crates/nabi-render" }

# --- error / log / async ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"   # 회전 파일 로그(사후 진단).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "io-util", "net", "time"] }
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
bytes = "1"

# --- serde / config ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
directories = "6"
# notify는 어느 크레이트도 쓰지 않아 제거(2026-08-16, T1-3 — 죽은 의존성 정리).
once_cell = "1"

# --- terminal / pty ---
portable-pty = "0.9"
# vt100은 T1에서 alacritty_terminal로 교체 완료(nabi-vt 내부 의존).
unicode-width = "0.1"
unicode-segmentation = "1"  # 캐럿을 grapheme cluster 단위로 옮기기 위한 경계 계산(편집기).
encoding_rs = "0.8"

# --- gui ---
egui = "0.36"              # T2-2 완료: 0.29→0.34→0.36. IME 오버홀(0.35)·harfrust 리거처·힌팅 수확.
egui_extras = "0.36"       # 탐색기식 컬럼 테이블(TableBuilder)용.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }  # 로컬 일시 표기.
# 렌더러는 wgpu(DX12→Vulkan→DX11→GL 자동 폴백). glow(OpenGL 단일)는 하이브리드 그래픽·RDP·
# 가상 GPU·구형 인텔 드라이버에서 컨텍스트 생성/스왑 실패로 화면이 안 보이는 사례가 있어 교체.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence"] }  # accesskit=스크린리더 접근성.
egui_dock = { version = "0.21", features = ["serde"] }  # egui 0.36 짝; 레이아웃 직렬화에 serde

# --- ssh / fs ---
nabi-ssh = { path = "crates/nabi-ssh" }
nabi-ssh-ext = { path = "crates/nabi-ssh-ext" }
nabi-session = { path = "crates/nabi-session" }
nabi-secret = { path = "crates/nabi-secret" }
nabi-fs = { path = "crates/nabi-fs" }
nabi-sftp = { path = "crates/nabi-sftp" }
nabi-editor = { path = "crates/nabi-editor" }
nabi-ftp = { path = "crates/nabi-ftp" }
async-trait = "0.1"
# 크립토 백엔드: 기본 aws-lc-rs(C/BoringSSL, CPU별 어셈블리)는 빌드 머신과 다른 CPU에서
# SSH 연결 시 잘못된 명령어로 즉사하는 사례 → 런타임 CPU 감지로 어디서나 도는 ring으로 교체.
russh = { version = "0.62.6", default-features = false, features = ["flate2", "rsa", "ring"] }  # 0.62.4~6: 원격 패킷 유발 클라이언트 패닉 수정(보안)
russh-sftp = "2"           # SFTP 서브시스템 클라이언트
suppaftp = { version = "8", features = ["tokio"] }  # FTP 비동기(tokio). FTPS는 tokio-rustls-ring

# --- security (vault) ---
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.11"              # SFTP 전송 무결성 해시(russh 의존 트리와 동일 버전)
zeroize = "1"
rand = "0.8"
# 볼트 마스터 비밀번호의 OS 자격증명 저장(선택, F1). Windows 네이티브 백엔드(windows-sys)라
# C 컴파일러 불필요 — Schannel/ring과 같은 이식성 정책에 부합.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.dev]
opt-level = 1        # 터미널/렌더 체감 위해 약간 최적화
[profile.dev.package."*"]
opt-level = 2        # 의존성은 더 최적화(빌드 1회 후 캐시)

# 배포 빌드: fat LTO + 심볼 스트립(크기↓·런타임 성능↑).
# panic=abort는 쓰지 않음 — actor.rs catch_unwind 패닉 격리에 unwind가 필요.
# codegen-units=1은 빌드시간 11분으로 과해 미적용(런타임 이득 대비 비용 큼).
[profile.release]
lto = "fat"          # 전체 LTO: 크레이트 간 인라인+죽은코드 제거 최대(thin보다 크기↓). 링크 시간↑(일회성).
strip = "symbols"    # 디버그 심볼 제거(바이너리 크기↓)
