# C 런타임을 **exe 안에 넣는다**(정적 링크).
#
# ## 왜
#
# 2026-09-10 사용자 보고: "VCRUNTIME140_1.dll 이 없어 코드 실행을 진행할 수 없습니다."
#
# 이 저장소는 MSVC 툴체인으로 빌드하므로 exe 가 `VCRUNTIME140.dll` 과
# `VCRUNTIME140_1.dll` 을 요구한다. 그 둘은 **윈도우에 들어 있지 않다** — Visual C++
# 재배포 패키지를 따로 깔아야 생긴다. 개발 기계에는 늘 깔려 있어서 우리 눈에는
# 안 보였고, 포장 검사(`xtask dist` 의 `is_system_dll`)도 "System32 에 있으면 윈도우
# 것"이라고 판단해 그냥 넘겼다.
#
# 그래서 재배포판이 없는 PC 에서는 **프로그램이 아예 뜨지 않았다.** 화면도 로그도 없이
# 윈도우 대화상자 하나가 뜰 뿐이라, 받은 사람이 할 수 있는 일이 없다.
#
# ## 왜 DLL 을 동봉하지 않고 정적으로 넣나
#
# 동봉해도 되지만, 그러면 **넣을 목록을 우리가 계속 맞춰야 한다**(런타임이 갈라지거나
# 새 의존성이 `MSVCP140` 을 부르면 또 빠진다). 정적으로 넣으면 그 목록 자체가 없어진다.
# 대가는 exe 가 몇백 KB 커지는 것뿐이다.
#
# 함께 동봉하는 DLL(WebView2Loader·Mesa)은 VC 런타임을 부르지 않는다(가져오기 표로
# 확인). 그래서 정적·동적 런타임이 한 프로세스에 섞이는 문제도 없다.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
